<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>浙江初中打卡刷题 - 浏览器演示版</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 800px; margin: 0 auto; }
        
        /* Header */
        header { 
            background: rgba(255,255,255,0.95); 
            padding: 25px; 
            margin-bottom: 20px; 
            border-radius: 16px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }
        h1 { 
            font-size: 24px; 
            color: #4A90D9;
            margin-bottom: 10px;
        }
        
        /* Cards */
        .card { 
            background: rgba(255,255,255,0.95); 
            border-radius: 16px; 
            padding: 25px; 
            margin-bottom: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.15);
        }
        .card h2 { 
            font-size: 20px; 
            margin-bottom: 20px; 
            color: #333;
        }
        
        /* Buttons */
        .btn { 
            background: linear-gradient(135deg, #4A90D9, #357ABD);
            color: white; 
            border: none; 
            padding: 12px 24px; 
            border-radius: 10px; 
            cursor: pointer; 
            font-size: 14px;
            margin: 5px;
            font-weight: 600;
        }
        .btn:hover { transform: translateY(-2px); }
        .btn-success { background: linear-gradient(135deg, #22c55e, #16a34a); }
        .btn-danger { background: linear-gradient(135deg, #ef4444, #dc2626); }
        
        /* Grade/Semester Selection */
        .selection-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 10px;
            margin-bottom: 20px;
        }
        .selection-card {
            padding: 15px;
            border: 2px solid #E8E8E8;
            border-radius: 10px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
        }
        .selection-card:hover { border-color: #4A90D9; }
        .selection-card.selected { 
            background: #E8F4FD; 
            border-color: #4A90D9; 
        }
        
        /* Question */
        .question-card {
            background: #F5F7FA;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 15px;
        }
        .question-text {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 20px;
        }
        .option {
            background: white;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 10px;
            cursor: pointer;
            border: 2px solid #E8E8E8;
        }
        .option:hover { border-color: #4A90D9; }
        .option.correct { background: #E8F8F0; border-color: #52C41A; }
        .option.wrong { background: #FFF1F0; border-color: #F5222D; }
        
        /* Progress */
        .progress-bar {
            height: 8px;
            background: #E8E8E8;
            border-radius: 4px;
            margin-bottom: 20px;
        }
        .progress-fill {
            height: 100%;
            background: #4A90D9;
            border-radius: 4px;
            transition: width 0.3s;
        }
        
        /* Stats */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
        }
        .stat-card {
            background: linear-gradient(135deg, #4A90D9, #357ABD);
            color: white;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
        }
        .stat-value { font-size: 32px; font-weight: bold; }
        .stat-label { font-size: 13px; opacity: 0.9; }
        
        /* Analysis */
        .analysis {
            background: #E8F8F0;
            padding: 15px;
            border-radius: 10px;
            border-left: 4px solid #52C41A;
            margin-top: 15px;
        }
        .analysis.wrong {
            background: #FFF1F0;
            border-left-color: #F5222D;
        }
        
        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📚 浙江初中打卡刷题</h1>
            <p style="color: #666; margin-top: 10px;">2026 年最新版教材 · 知识点每日练习</p>
        </header>

        <!-- 首页：年级学期选择 -->
        <div id="home-screen" class="card">
            <h2>📌 选择年级</h2>
            <div class="selection-grid">
                <div class="selection-card" onclick="selectGrade('7', this)">
                    <div style="font-size: 32px;">7️⃣</div>
                    <div>七年级</div>
                </div>
                <div class="selection-card" onclick="selectGrade('8', this)">
                    <div style="font-size: 32px;">8️⃣</div>
                    <div>八年级</div>
                </div>
                <div class="selection-card" onclick="selectGrade('9', this)">
                    <div style="font-size: 32px;">9️⃣</div>
                    <div>九年级</div>
                </div>
            </div>

            <h2>📖 选择学期</h2>
            <div class="selection-grid">
                <div class="selection-card" onclick="selectSemester('1', this)">
                    <div style="font-size: 32px;">📖</div>
                    <div>上册</div>
                </div>
                <div class="selection-card" onclick="selectSemester('2', this)">
                    <div style="font-size: 32px;">📗</div>
                    <div>下册</div>
                </div>
            </div>

            <button class="btn" onclick="startCheckin()" style="width: 100%; margin-top: 20px; padding: 18px;">
                🚀 开始每日打卡
            </button>
        </div>

        <!-- 答题页 -->
        <div id="answer-screen" class="card hidden">
            <div style="display: flex; justify-content: space-between; margin-bottom: 15px;">
                <span id="progress-text">第 1 / 50 题</span>
                <span id="score-text">得分：0</span>
            </div>
            <div class="progress-bar">
                <div id="progress-fill" class="progress-fill" style="width: 0%"></div>
            </div>

            <div id="question-container"></div>
        </div>

        <!-- 结果页 -->
        <div id="result-screen" class="card hidden">
            <h2>🎉 打卡完成！</h2>
            <div class="stats-grid">
                <div class="stat-card">
                    <div id="final-score" class="stat-value">0</div>
                    <div class="stat-label">得分</div>
                </div>
                <div class="stat-card">
                    <div id="final-percentage" class="stat-value">0%</div>
                    <div class="stat-label">正确率</div>
                </div>
                <div class="stat-card">
                    <div id="total-questions" class="stat-value">50</div>
                    <div class="stat-label">总题数</div>
                </div>
            </div>

            <button class="btn" onclick="location.reload()" style="width: 100%; margin-top: 20px;">
                🔄 再来一次
            </button>
        </div>
    </div>

    <script>
        // 题库数据（示例）
        const questions = [
            {
                id: 1,
                subject: '语文',
                topic: '《春》- 朱自清',
                question: '《春》一文中，作者描写春草的特点是？',
                options: ['A. 嫩嫩的，绿绿的', 'B. 软绵绵的', 'C. 青得逼你的眼', 'D. 以上都是'],
                answer: 'D',
                analysis: '《春》中描写春草："小草偷偷地从土里钻出来，嫩嫩的，绿绿的。园子里，田野里，瞧去，一大片一大片满是的。坐着，躺着，打两个滚，踢几脚球，赛几趟跑，捉几回迷藏。风轻悄悄的，草软绵绵的。"'
            },
            {
                id: 2,
                subject: '数学',
                topic: '有理数',
                question: '-5 的相反数是？',
                options: ['A. 5', 'B. -5', 'C. 1/5', 'D. -1/5'],
                answer: 'A',
                analysis: '相反数的定义：只有符号不同的两个数互为相反数。-5 的相反数是 5。'
            },
            {
                id: 3,
                subject: '英语',
                topic: 'Greetings',
                question: '— Good morning! — _______',
                options: ['A. Good afternoon!', 'B. Good morning!', 'C. Good evening!', 'D. Good night!'],
                answer: 'B',
                analysis: '当别人说"Good morning!"时，应该同样回应"Good morning!"。'
            },
            {
                id: 4,
                subject: '科学',
                topic: '生物 - 细胞',
                question: '植物细胞特有的结构是？',
                options: ['A. 细胞膜', 'B. 细胞质', 'C. 细胞壁', 'D. 细胞核'],
                answer: 'C',
                analysis: '植物细胞特有的结构包括：细胞壁、叶绿体、大液泡。动物细胞没有这些结构。'
            },
            {
                id: 5,
                subject: '社会',
                topic: '历史 - 中国早期人类',
                question: '我国境内目前已确认的最早古人类是？',
                options: ['A. 北京人', 'B. 山顶洞人', 'C. 元谋人', 'D. 蓝田人'],
                answer: 'C',
                analysis: '元谋人发现于云南元谋县，距今约 170 万年，是我国境内目前已确认的最早古人类。'
            }
        ];

        let currentGrade = null;
        let currentSemester = null;
        let currentQuestionIndex = 0;
        let score = 0;
        let shuffledQuestions = [];

        function selectGrade(grade, element) {
            currentGrade = grade;
            document.querySelectorAll('#home-screen .selection-card').forEach(el => el.classList.remove('selected'));
            element.classList.add('selected');
        }

        function selectSemester(semester, element) {
            currentSemester = semester;
            document.querySelectorAll('#home-screen .selection-card').forEach(el => {
                if (!el.innerText.includes('年级')) el.classList.remove('selected');
            });
            element.classList.add('selected');
        }

        function startCheckin() {
            if (!currentGrade || !currentSemester) {
                alert('请先选择年级和学期！');
                return;
            }
            
            // 随机打乱题目
            shuffledQuestions = [...questions].sort(() => Math.random() - 0.5);
            currentQuestionIndex = 0;
            score = 0;
            
            document.getElementById('home-screen').classList.add('hidden');
            document.getElementById('answer-screen').classList.remove('hidden');
            
            showQuestion();
        }

        function showQuestion() {
            const question = shuffledQuestions[currentQuestionIndex];
            const container = document.getElementById('question-container');
            
            document.getElementById('progress-text').innerText = `第 ${currentQuestionIndex + 1} / ${shuffledQuestions.length} 题`;
            document.getElementById('score-text').innerText = `得分：${score}`;
            document.getElementById('progress-fill').style.width = `${((currentQuestionIndex + 1) / shuffledQuestions.length) * 100}%`;
            
            container.innerHTML = `
                <div class="question-card">
                    <div style="display: flex; justify-content: space-between; margin-bottom: 15px;">
                        <span style="background: #4A90D9; color: white; padding: 5px 10px; border-radius: 5px; font-size: 12px;">${question.subject}</span>
                        <span style="color: #666; font-size: 13px;">📌 ${question.topic}</span>
                    </div>
                    <div class="question-text">${question.question}</div>
                    <div>
                        ${question.options.map((option, index) => `
                            <div class="option" onclick="selectAnswer(this, '${option[0]}', '${question.answer}')">${option}</div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function selectAnswer(element, selected, correct) {
            // 防止重复点击
            if (element.parentElement.classList.contains('answered')) return;
            element.parentElement.classList.add('answered');
            
            const isCorrect = selected === correct;
            
            if (isCorrect) {
                element.classList.add('correct');
                score++;
            } else {
                element.classList.add('wrong');
                // 显示正确答案
                const options = element.parentElement.querySelectorAll('.option');
                options.forEach(opt => {
                    if (opt.innerText.startsWith(correct + '.')) {
                        opt.classList.add('correct');
                    }
                });
            }
            
            // 显示解析
            const question = shuffledQuestions[currentQuestionIndex];
            const analysisDiv = document.createElement('div');
            analysisDiv.className = `analysis ${isCorrect ? '' : 'wrong'}`;
            analysisDiv.innerHTML = `
                <strong>${isCorrect ? '✅ 回答正确！' : '❌ 回答错误'}</strong><br>
                正确答案：${correct}<br><br>
                📖 ${question.analysis}
            `;
            document.querySelector('.question-card').appendChild(analysisDiv);
            
            // 1.5 秒后下一题
            setTimeout(() => {
                currentQuestionIndex++;
                if (currentQuestionIndex < shuffledQuestions.length) {
                    showQuestion();
                } else {
                    showResult();
                }
            }, 2000);
        }

        function showResult() {
            document.getElementById('answer-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.remove('hidden');
            
            const percentage = Math.round((score / shuffledQuestions.length) * 100);
            document.getElementById('final-score').innerText = score;
            document.getElementById('final-percentage').innerText = percentage + '%';
            document.getElementById('total-questions').innerText = shuffledQuestions.length;
        }
    </script>
</body>
</html>
